services:
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    environment:
      - PORT=4000
      - NODE_ENV=production
      # Required for DHIS2 App Management auto-connect (issue #3).
      # Generate a Personal Access Token in DHIS2 → User Settings → PAT
      # and set it here. The backend uses it to call /api/me on behalf of the app.
      - DHIS2_API_TOKEN=${DHIS2_API_TOKEN}
      # Secret for signing the HttpOnly session cookie (issue #4).
      # Must be a long random string, e.g.: openssl rand -hex 32
      - COOKIE_SECRET=${COOKIE_SECRET}
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      start_period: 15s
      interval: 10s
      timeout: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: dhis2-network
